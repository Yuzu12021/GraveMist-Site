<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GRAVE MIST | Play</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    body { display: flex; align-items: center; justify-content: center; }
    /* The Unity layout always receives 1640 x 2360 CSS pixels.
       Only the outer wrapper is visually scaled to fit the viewport. */
    #game-stage { position: relative; width: 1640px; height: 2360px; flex: none; transform-origin: center center; overflow: hidden; }
    #unity-container, #unity-container.unity-desktop, #unity-container.unity-mobile {
      position: absolute !important; inset: 0 !important; left: 0 !important; top: 0 !important;
      width: 1640px !important; height: 2360px !important;
      transform: none !important; margin: 0 !important; padding: 0 !important;
      background: #111;
    }
    #unity-canvas, #unity-canvas.unity-mobile {
      display: block !important; position: absolute !important; inset: 0 !important;
      width: 1640px !important; height: 2360px !important;
      max-width: none !important; max-height: none !important;
      margin: 0 !important; padding: 0 !important;
      background: #111;
    }
    #unity-footer { display: none !important; }
    #unity-loading-bar { z-index: 5; }
    #unity-warning { z-index: 6; }
  </style>
</head>
<body>
  <div id="game-stage">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="1640" height="2360" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">GraveMist_3D</div>
      </div>
    </div>
  </div>
  <script>
    const LOGICAL_WIDTH = 1640;
    const LOGICAL_HEIGHT = 2360;
    const stage = document.getElementById('game-stage');
    const canvas = document.getElementById('unity-canvas');

    function fitGameToWindow() {
      const availableWidth = document.documentElement.clientWidth;
      const availableHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const scale = Math.min(availableWidth / LOGICAL_WIDTH, availableHeight / LOGICAL_HEIGHT);
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fitGameToWindow);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fitGameToWindow);
    fitGameToWindow();

    function unityShowBanner(msg, type) {
      const banner = document.getElementById('unity-warning');
      const div = document.createElement('div');
      div.textContent = msg;
      div.style.cssText = `padding:10px;background:${type === 'error' ? 'red' : 'yellow'};color:black;`;
      banner.appendChild(div);
      banner.style.display = 'block';
      if (type !== 'error') setTimeout(() => {
        div.remove();
        if (!banner.children.length) banner.style.display = 'none';
      }, 5000);
    }

    const buildUrl = 'Build';
    const loaderUrl = buildUrl + '/WebBuild.loader.js';
    const config = {
      arguments: [],
      dataUrl: buildUrl + '/WebBuild.data',
      frameworkUrl: buildUrl + '/WebBuild.framework.js',
      codeUrl: buildUrl + '/WebBuild.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'DefaultCompany',
      productName: 'GraveMist_3D',
      productVersion: '0.1.0',
      showBanner: unityShowBanner,
      // Preserve a fixed logical canvas size, independent of browser DPI.
      devicePixelRatio: 1
    };

    document.getElementById('unity-loading-bar').style.display = 'block';
    const script = document.createElement('script');
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, progress => {
        document.getElementById('unity-progress-bar-full').style.width = (100 * progress) + '%';
      }).then(unityInstance => {
        document.getElementById('unity-loading-bar').style.display = 'none';
        fitGameToWindow();
      }).catch(message => {
        unityShowBanner(String(message), 'error');
      });
    };
    script.onerror = () => unityShowBanner('Unity loader could not be loaded.', 'error');
    document.body.appendChild(script);
  </script>
</body>
</html>
